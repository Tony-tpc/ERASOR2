start_frame: 0
end_frame: 2700
viz_interval: 10
is_large_scale: false

dataloader:
    run_traj_clustering: false
    dataset_name: "SemanticKITTI"
    abs_data_dir: "/home/tony/erasor2_dataset/dataset/sequences"
    cloud_dir: ""
    cloud_format: ""
    pose_path: ""
    sequence: "00"
    abs_save_dir: "/home/tony/erasor2_output"
    instance_seg_method: "hdbscan"

    accum_interval: 2
    voxel_size: 0.05
    map_voxel_size: 0.05

    expansion_range: 0

erasor2:
    grid_resolution: 0.5
    egocentric_grid_resolution: 0.3
    range_of_interest: 40.0

    min_z_voi: -1.5
    max_z_voi: 2.3
    min_z_diff_thr: 0.3
    scan_ratio_threshold: 0.2

    log_odds:
        increment_gain: 2.0
        increment: 0.15

    region_proposal_thr: 0.8
    kernel_size: 1

    ratio_num_pts: 0.95
    minimum_num_pts: 5

    moving_object_detection:
        negative_log_odds: -2.0
        obj_score_soft_thr: 4.6
        obj_score_hard_thr: 14.0
        hard_thr_radius: 10.0

    over_segmentation:
        minimum_area_thr: 8
        ratio_of_unknown_prior: 0.25

    volumetric_outlier_removal:
        window_size: 1
        use_adaptive_voxel_size: true
        vor_cand_score_thr: 4.6
        dist_thr_gain: 1.732

    viz_flag:
        set_scan_and_pose: false
        set_submap: false
        update: false
        detect: false
        over_seg: false

    save_map: true

stop_for_each_frame: false

extrinsic:
    robot_body_size: 0.6
    sensor_height: 0.0
    rotation: [ 1, 0, 0,
                0, 1, 0,
                0, 0, 1 ]
    translation: [ 0.0, 0.0, 0.0 ]

# External-memory execution. This is the recommended mode for long sequences.
streaming:
    enabled: true
    # Global maps are label-preserving voxelized whenever this many points are
    # reached. Lower values reduce peak RAM but increase CPU time.
    compact_threshold_points: 3000000
    # Keep false for self-collected data whose labels/ directory contains
    # dummy SemanticKITTI labels.
    use_gt_labels: false

rerun:
    enabled: false
    spawn: false
    save_path: ""
